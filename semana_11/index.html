<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP de Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="d-flex justify-content-center bg-success">
        <h1> $1.200.00</h1>
    </header>
    <main class="container mt-4">
        <div class="card p-3">
            <h4>Cafe</h4>
            <p>$5700</p>
        </div>

    </main>

      <button id="btnNuevo" type="button" 
            class="btn-solid theme-primary"
            data-bs-toggle="dialog" data-bs-target="#exampleDialog"
            >+</button>

    <dialog class="dialog" id="exampleDialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Nuevo Gasto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <label for="">Nombre</label>
            <input id="nombre" type="text" class="form-control">

            <label for="">Valor</label>
            <input id="valor" type="number" class="form-control">
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cerrar</button>
            <button id="btnGuardar" type="button" class="btn-solid theme-primary">Guardar</button>
        </div>
    </dialog>
    <footer>
        <p>APP de Gastos</p>
    </footer>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
