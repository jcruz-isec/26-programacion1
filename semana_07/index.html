<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/menu.png" type="image/png">
</head>
<body>
    <header>
        <img src="images/menu.png" alt="menu" class="logo">
        <h1>Menú digital</h1>
    </header>

    <main>
        <div class="row">
            <div class="col">
                <form action="">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text">

                    <label for="precio">Precio</label>
                    <input id="precio" type="number">

                    <label for="categoria">Categoría</label>
                    <select id="categoria">
                    </select>
                    <p id="mensaje"></p>
                    <hr>
                    <button type="submit">Guardar</button>
                </form>
            </div>
            <div class="col">
                <ul class="list-items">
                    <li> Item 1</li>
                    <li> Item 1</li>
                    <li> Item 1</li>

                </ul>
            </div>
            <div class="col">
                <div class="carousel">
                    <img id="foto" src="images/foto1.jpg" alt="foto">
                    <button id="btnAnterior" type="button">Anterior</button>
                    <button id="btnSiguiente" type="button">Siguiente</button>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <p>ISEC | Programación I  | 2026</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
